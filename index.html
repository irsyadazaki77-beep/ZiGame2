<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />
    <title>ZIGAME</title>
    <meta name="description" content="Kumpulan game arkade retro-cyber modern dengan UI/UX premium responsif, dioptimalkan untuk desktop dan mobile dengan audio synthesizer, papan lobi dinamis, dan sistem skor lokal terpadu." />
    <meta property="og:title" content="ZIGAME" />
    <meta property="og:description" content="Kumpulan game arkade retro-cyber modern dengan UI/UX premium responsif, dioptimalkan untuk desktop dan mobile dengan audio synthesizer, papan lobi dinamis, dan sistem skor lokal terpadu." />
    <meta name="theme-color" content="#080a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZIGAME" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('zigame_theme');
          var isExplicitLight = savedTheme === 'light' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches && !window.matchMedia('(prefers-color-scheme: dark)').matches);
          var baseMode = savedTheme === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', baseMode);
          if (savedTheme && savedTheme !== 'light' && savedTheme !== 'dark') {
            document.documentElement.setAttribute('data-accent-theme', savedTheme);
          }
          if (baseMode === 'light' && isExplicitLight) {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; background: #080a0f; color: #f4f4f5; font-family: monospace; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        JavaScript diperlukan untuk menjalankan ZIGAME Retro Cyber Arcade. Silakan aktifkan JavaScript di pengaturan browser Anda.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
