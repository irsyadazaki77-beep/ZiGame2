<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIGAME</title>
    <meta name="description" content="Kumpulan game arkade retro-cyber modern dengan UI/UX premium responsif, dioptimalkan untuk desktop dan mobile dengan audio synthesizer, papan lobi dinamis, dan sistem skor lokal terpadu." />
    <meta property="og:title" content="ZIGAME" />
    <meta property="og:description" content="Kumpulan game arkade retro-cyber modern dengan UI/UX premium responsif, dioptimalkan untuk desktop dan mobile dengan audio synthesizer, papan lobi dinamis, dan sistem skor lokal terpadu." />
    <meta name="theme-color" content="#080a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZIGAME" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('zigame_theme');
          const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
